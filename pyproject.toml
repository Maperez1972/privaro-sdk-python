[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privaro"
version = "0.7.0"
description = "Privacy Infrastructure for Enterprise AI — iCommunity Labs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["privacy", "ai", "gdpr", "pii", "llm", "agents", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
async = ["aiohttp>=3.8"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "aiohttp>=3.8"]

[project.urls]
Homepage = "https://privaro.ai"
Documentation = "https://privaro.ai/docs"
Repository = "https://github.com/Maperez1972/privaro-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["privaro"]
